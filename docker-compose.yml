services:
  claude-telegram:
    build: .
    container_name: claude-telegram
    # sysbox-runc: secure Docker-in-Docker without --privileged
    runtime: sysbox-runc
    restart: unless-stopped
    mem_limit: 4g
    pids_limit: 500
    stdin_open: true
    tty: true
    volumes:
      - claude-home:/home/claude

volumes:
  claude-home:
